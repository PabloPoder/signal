name: signal
description: "A new Flutter project."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter

  window_size: ^0.1.0
  flutter_shaders: ^0.1.3
  google_fonts: ^8.1.0
  flutter_riverpod: ^3.3.1
  
  media_kit: ^1.1.11
  media_kit_libs_windows_audio: ^1.0.9
  media_kit_native_event_loop: ^1.0.9


dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0


flutter:

  uses-material-design: true

  shaders:
    - assets/shaders/crt.frag

  # To add assets to your application, add an assets section, like this:
  # assets:
  #   - images/a_dot_burr.jpeg
  #   - images/a_dot_ham.jpeg

  assets:
    - assets/audio/keyboard/
    # - assets/audio/ui/
    # - assets/audio/ambience/

  fonts:
    - family: VT323
      fonts:
        - asset: assets/fonts/VT323-Regular.ttf
          style: normal

    - family: IBM Plex Mono
      fonts:
        - asset: assets/fonts/IBMPlexMono-Regular.ttf
          style: normal

    - family: BIGBlueTerm
      fonts:
        - asset: assets/fonts/BigBlueTerm437NerdFontMono-Regular.ttf
          style: normal

    - family: Fixedsys62
      fonts:
        - asset: assets/fonts/Fixedsys62.ttf
          style: normal